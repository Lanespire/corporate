<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<!-- Theme color -->
		<meta name="theme-color" content="#ffffff" />

		<!-- Defaults (each route should override title/description/og:* via svelte:head) -->
		<meta name="author" content="株式会社Lanespire" />

		<script>
			document.documentElement.classList.add('js');
			setTimeout(function () {
				if (!window.__corpReady) document.documentElement.classList.add('reveal-all');
			}, 5000);
		</script>
		<script src="/analytics.js" defer></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
